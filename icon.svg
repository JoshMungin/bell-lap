<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Bell Lap app icon: a navy bell on gold. The bell sits inside the central
       safe zone so Android can crop the icon to any shape. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a" />
      <stop offset="0.55" stop-color="#f2bf4f" />
      <stop offset="1" stop-color="#c99532" />
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1">
      <stop offset="0" stop-color="#060f22" />
      <stop offset="0.45" stop-color="#1f3d78" />
      <stop offset="1" stop-color="#0a1730" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#gold)" />
  <g transform="translate(256 262) scale(5.4)">
    <circle cx="0" cy="-27" r="4" fill="none" stroke="#0a1730" stroke-width="3" />
    <path d="M-18,10 C-18,-8 -12,-21 0,-23 C12,-21 18,-8 18,10 L23,16 L-23,16 Z" fill="url(#navy)" />
    <circle cx="0" cy="20" r="4.5" fill="#0a1730" />
  </g>
</svg>
